name: Host tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure host tests
        run: cmake -S . -B build

      - name: Build host tests
        run: cmake --build build --parallel

      - name: Run host tests
        run: ctest --test-dir build --output-on-failure
